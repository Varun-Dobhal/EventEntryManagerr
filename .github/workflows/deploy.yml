name: Deploy EventEntryManager

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}

          script: |
            set -e

            echo "========================================"
            echo "🚀 EventEntryManager Deployment"
            echo "========================================"

            cd ~/EventEntryManagerr

            echo "📥 Fetching latest code..."
            git fetch origin main

            echo "🔄 Syncing server with main..."
            git reset --hard origin/main

            echo "📦 Installing backend dependencies..."
            cd backend
            npm ci

            echo "⚙️ Generating Prisma client..."
            npx prisma generate

            echo "🔄 Restarting backend..."
            pm2 restart evententry-backend --update-env

            echo "🎨 Installing frontend dependencies..."
            cd ../frontend
            npm ci

            echo "🏗️ Building frontend..."
            npm run build

            echo "📦 Deploying frontend..."
            sudo rm -rf /var/www/evententry/*
            sudo cp -r dist/. /var/www/evententry/

            echo "🔍 Testing Nginx configuration..."
            sudo nginx -t

            echo "🔄 Reloading Nginx..."
            sudo systemctl reload nginx

            echo "🏥 Checking backend..."
            curl -f http://127.0.0.1:5001/api/health

            echo ""
            echo "========================================"
            echo "✅ DEPLOYMENT SUCCESSFUL"
            echo "========================================"

            pm2 status
